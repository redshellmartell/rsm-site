<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">{{name}}</a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          {{nav}}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <div>
        <a class="brand" href="/">{{name}}</a>
        <p><a href="mailto:{{email}}">{{email}}</a></p>
      </div>
      <nav aria-label="Social">
        <ul class="social">
            {{social}}
        </ul>
      </nav>
      <p class="copyright">&copy; {{year}} {{name}}</p>
    </div>
  </footer>
</body>
</html>
